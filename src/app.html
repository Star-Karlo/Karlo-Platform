<!doctype html>
<!-- translate="no": the console is an application with its own ID/EN switch.
     Chrome's page translator rewrites the DOM text nodes Svelte owns, so a
     translated page stops updating (a picked agreement never appears, names
     change under the form) — it must not run here. -->
<html lang="id" translate="no" class="notranslate">
	<head>
		<meta name="google" content="notranslate" />
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<title>Karlo - Transport Management System</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
