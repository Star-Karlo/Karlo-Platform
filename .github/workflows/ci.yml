# Every push and pull request: type-check, lint, unit tests, production build.
# Deployment is a separate workflow that runs only on main; this one gates
# nothing but tells you before the deploy does.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check (svelte-check)
        run: npm run check
      - name: Lint (eslint)
        run: npm run lint
      - name: Format (prettier, src only)
        run: npm run format:check
        continue-on-error: true
      - name: Unit tests (vitest)
        run: npm test
      - name: Build
        run: npm run build
        env:
          PUBLIC_MAPID_BASEMAP_KEY: ci-placeholder
